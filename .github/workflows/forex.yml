name: forex

on:
  schedule:
    - cron: "7 * * * 1-5"
    - cron: "30 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "backtest or scan"
        type: choice
        options:
          - backtest
          - scan
        default: backtest

permissions:
  contents: write

concurrency:
  group: forex
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas numpy yfinance

      - name: Run
        run: python forex_tools.py --${{ github.event.inputs.mode || (github.event.schedule == '30 6 * * 0' && 'backtest' || 'scan') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOREX_TF: ${{ vars.FOREX_TF || 'all' }}
          FOREX_PAIRS: ${{ vars.FOREX_PAIRS || 'all' }}
          FOREX_REPORT: ${{ vars.FOREX_REPORT }}

      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add forex_results.json forex_state.json
          git diff --cached --quiet || (git commit -m "update forex data" && git pull --rebase && git push)
