name: airdrop-spotter
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
concurrency:
  group: airdrop-spotter
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python airdrop_scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "airdrop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/airdrop_seen.json || true
          git diff --cached --quiet || (git commit -m "airdrop state" && git pull --rebase -q && git push)
