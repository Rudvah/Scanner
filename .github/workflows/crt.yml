name: crt

on:
  schedule:
    - cron: "3,18,33,48 * * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - backtest
          - scan
        default: backtest

permissions:
  contents: write

concurrency:
  group: crt
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy yfinance
      - name: Run
        run: python crt_tools.py --${{ github.event.inputs.mode || 'scan' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOREX_TF: ${{ vars.FOREX_TF || '4h' }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add crt_results.json crt_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update crt data" && git pull --rebase && git push)
